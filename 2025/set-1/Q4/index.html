<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compose Mail</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f5f8;
        }

        .container {
            width: 700px;
            margin: 50px auto;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px #aaa;
        }

        .header {
            background-color: #4285f4;
            color: white;
            padding: 15px 20px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 8px 8px 0 0;
        }

        .mail-form {
            padding: 20px;
        }

        .row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .row label {
            width: 80px;
            font-weight: bold;
        }

        .row input {
            flex: 1;
            padding: 10px;
            border: none;
            border-bottom: 1px solid #ccc;
            outline: none;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            resize: vertical;
            font-family: Arial;
            font-size: 15px;
        }

        .buttons {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
        }

        .send {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
        }

        .send:hover {
            background-color: #1557b0;
        }

        .reset {
            background-color: #eee;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }

        .options {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            Compose Mail
        </div>

        <form class="mail-form">

            <div class="row">
                <label>To:</label>
                <input type="email" placeholder="Recipients" required>
            </div>

            <div class="row">
                <label>Cc:</label>
                <input type="email" placeholder="Cc">
            </div>

            <div class="row">
                <label>Bcc:</label>
                <input type="email" placeholder="Bcc">
            </div>

            <div class="row">
                <label>Subject:</label>
                <input type="text" placeholder="Subject">
            </div>

            <textarea placeholder="Compose your mail..."></textarea>

            <div class="options">
                <input type="file">
            </div>

            <div class="buttons">
                <div>
                    <button type="submit" class="send">Send</button>
                    <button type="reset" class="reset">Discard</button>
                </div>
            </div>

        </form>

    </div>

</body>
</html>
