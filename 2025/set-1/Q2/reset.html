<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
        }

        .box {
            width: 400px;
            margin: 70px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            display: block;
            margin: 25px auto;
            padding: 10px 30px;
            background-color: darkblue;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>New Password</h1>

    <form action="sucess.html">
        <label for="newpass">New Password:</label>
        <input type="password" id="newpass" name="newpass" required>

        <label for="repass">Retype New Password:</label>
        <input type="password" id="repass" name="repass" required>

        <button type="submit">Change</button>
    </form>

</div>

</body>
</html>
