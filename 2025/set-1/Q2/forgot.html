<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
        }

        .box {
            width: 400px;
            margin: 80px auto;
            padding: 30px;
            background-color: white;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: darkblue;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 25px;
            background-color: darkblue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        a {
            color: blue;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Forgot Password</h1>

    <p>Enter your User ID to reset your password.</p>

    <input type="text" placeholder="Enter User ID">

    <br>

    <button onclick="location.href='reset.html'">
        Reset Password
    </button>

    <p>
        <a href="login.html">Login</a>
    </p>

</div>

</body>
</html>
