<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Background Image */
        .container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .welcome {
            position: absolute;
            font-size: 30px;
            font-weight: bold;
            color: white;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
        }

        /* Top Left */
        .top-left {
            top: 20px;
            left: 20px;
        }

        /* Top Right */
        .top-right {
            top: 20px;
            right: 20px;
        }

        /* Bottom Right */
        .bottom-right {
            bottom: 20px;
            right: 20px;
        }

        /* Bottom Left */
        .bottom-left {
            bottom: 20px;
            left: 20px;
        }

        /* Center */
        .center {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {

            .welcome {
                font-size: 20px;
                padding: 7px 12px;
            }

            .top-left {
                top: 10px;
                left: 10px;
            }

            .top-right {
                top: 10px;
                right: 10px;
            }

            .bottom-left {
                bottom: 10px;
                left: 10px;
            }

            .bottom-right {
                bottom: 10px;
                right: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="welcome top-left">
            Welcome
        </div>

        <div class="welcome top-right">
            Welcome
        </div>

        <div class="welcome bottom-right">
            Welcome
        </div>

        <div class="welcome bottom-left">
            Welcome
        </div>

        <div class="welcome center">
            Welcome
        </div>

    </div>

</body>
</html>
