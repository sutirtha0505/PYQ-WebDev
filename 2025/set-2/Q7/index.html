<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Two Column Layout</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: darkblue;
            padding: 20px;
        }

        .container {
            display: flex;
            width: 90%;
            margin: auto;
            gap: 20px;
        }

        .column {
            flex: 1;
            padding: 30px;
            min-height: 300px;
            border-radius: 10px;
            box-shadow: 0 0 8px gray;
        }

        .left {
            background-color: #d6eaf8;
        }

        .right {
            background-color: #d5f5e3;
        }

        .column h2 {
            color: darkblue;
        }

        .column p {
            font-size: 18px;
            line-height: 1.6;
        }

        /* Mobile View */
        @media (max-width: 600px) {

            .container {
                flex-direction: column;
                width: 90%;
            }

            .column {
                width: 100%;
                padding: 20px;
                min-height: 200px;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Web Page</h1>

    <div class="container">

        <div class="column left">
            <h2>Column One</h2>
            <p>
                This is the first column of the webpage.
                It contains information about HTML and web development.
            </p>
        </div>

        <div class="column right">
            <h2>Column Two</h2>
            <p>
                This is the second column of the webpage.
                It contains information about CSS and responsive design.
            </p>
        </div>

    </div>

</body>
</html>
