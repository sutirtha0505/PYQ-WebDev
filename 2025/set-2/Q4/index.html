<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 2px solid #555;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: darkblue;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #eaf2f8;
        }

        tr:hover {
            background-color: #d5f5e3;
        }

        .price {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Product List</h1>

    <table>

        <tr>
            <th>Product Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Available Stock</th>
        </tr>

        <tr>
            <td>Laptop</td>
            <td>Electronics</td>
            <td class="price">₹55,000</td>
            <td>15</td>
        </tr>

        <tr>
            <td>Smartphone</td>
            <td>Electronics</td>
            <td class="price">₹25,000</td>
            <td>25</td>
        </tr>

        <tr>
            <td>Headphones</td>
            <td>Accessories</td>
            <td class="price">₹2,500</td>
            <td>40</td>
        </tr>

        <tr>
            <td>Keyboard</td>
            <td>Computer Accessories</td>
            <td class="price">₹1,200</td>
            <td>30</td>
        </tr>

        <tr>
            <td>Smart Watch</td>
            <td>Wearable</td>
            <td class="price">₹4,000</td>
            <td>20</td>
        </tr>

    </table>

</body>
</html>
