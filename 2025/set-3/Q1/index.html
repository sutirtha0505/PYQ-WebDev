<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Web Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Navigation Bar */
        nav {
            background-color: #333;
            display: flex;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            display: block;
        }

        nav a:hover {
            background-color: #1e90ff;
        }

        /* Body Content */
        .content {
            width: 80%;
            margin: 40px auto;
            padding: 25px;
            background-color: white;
            text-align: center;
            box-shadow: 0 0 8px gray;
        }

        .content img {
            width: 400px;
            max-width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }

        h1 {
            color: darkblue;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
        }

        /* Responsive Navigation */
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Body Content -->
    <div class="content">

        <h1>Welcome to My Web Page</h1>

        <img src="nature.jpg" alt="Beautiful Nature">

        <p>
            Nature is one of the most beautiful gifts of our planet.
            It includes mountains, rivers, forests, flowers and many
            other wonderful things. We should protect nature and keep
            our environment clean and green.
        </p>

    </div>

</body>
</html>
