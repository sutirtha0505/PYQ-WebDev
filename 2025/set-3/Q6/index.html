<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Web Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Navigation Bar */
        nav {
            background-color: #222;
            display: flex;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 16px 25px;
            display: block;
        }

        nav a:hover {
            background-color: #1e90ff;
        }

        /* Main Content */
        .content {
            width: 80%;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            text-align: center;
            box-shadow: 0 0 10px gray;
            border-radius: 10px;
        }

        h1 {
            color: darkblue;
        }

        p {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
        }

        iframe {
            width: 80%;
            height: 400px;
            border: none;
            border-radius: 10px;
            margin-top: 20px;
        }

        /* Responsive Design */
        @media (max-width: 600px) {

            nav {
                flex-wrap: wrap;
            }

            nav a {
                padding: 12px 15px;
            }

            .content {
                width: 90%;
            }

            iframe {
                width: 100%;
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <!-- Horizontal Navigation Bar -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Gallery</a>
    </nav>

    <!-- Web Page Content -->
    <div class="content">

        <h1>Welcome to My Web Page</h1>

        <p>
            This is a simple web page created using HTML and CSS.
            It contains a horizontal navigation bar with four links
            and an embedded YouTube video.
        </p>

        <h2>Featured Video</h2>

        <!-- YouTube Video -->
        <iframe
            src="https://www.youtube.com/embed/ScMzIvxBSi4"
            title="YouTube Video"
            allowfullscreen>
        </iframe>

    </div>

</body>

</html>
