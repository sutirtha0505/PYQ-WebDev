<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seminar Schedule</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <table>
      <!-- First Header Row -->
      <tr>
        <th rowspan="3">Day</th>
        <th colspan="3">Seminar</th>
      </tr>

      <!-- Second Header Row -->
      <tr>
        <th colspan="2">Schedule</th>
        <th rowspan="2">Topics</th>
      </tr>

      <!-- Third Header Row -->

      <tr>
        <th>Begin</th>
        <th>End</th>
      </tr>

      <!-- Monday -->
      <tr>
        <td class="day" rowspan="2">Monday</td>
        <td rowspan="2">8:00AM</td>
        <td rowspan="2">5:00PM</td>
        <td class="topic">IOT</td>
      </tr>

      <tr>
        <td class="topic">Tranforming Healthcare with IOMT</td>
      </tr>

      <!-- Tuesday -->
      <tr>
        <td class="day" rowspan="2">Tuesday</td>
        <td>8:00AM</td>
        <td>1:00PM</td>
        <td class="topic">
          Fundemntal of AI and it's applications
        </td>
      </tr>

      <tr>
        <td>2:00PM</td>
        <td>5:00PM</td>
        <td class="topic">Cloud Computing</td>
      </tr>

      <!-- Wednesday -->

      <td class="day">Wednesday</td>
      <td>8:00AM</td>
      <td>12:00PM</td>
      <td class="topic">Reinforcement Learning</td>
    </table>
  </body>
</html>
