<!DOCTYPE html>
<html>
<head>
    <title>Tourist Places</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        h2 {
            color: darkblue;
        }

        ul {
            line-height: 2;
        }

        a {
            color: darkblue;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: red;
            text-decoration: underline;
        }

        .region {
            color: #333;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Tourist Places of India</h2>

    <ul>
        <li>
            <span class="region">India</span>

            <ul>
                <!-- North India -->
                <li>
                    <span class="region">North India</span>

                    <ol type="i">
                        <li>
                            <a href="https://images.unsplash.com/photo-1587474260584-136574528ed5?auto=format&fit=crop&w=900&q=80" target="_blank">Delhi</a>
                        </li>

                        <li>
                            <a href="https://images.unsplash.com/photo-1605649487212-2605d8ad6f7d?auto=format&fit=crop&w=900&q=80" target="_blank">Shimla</a>
                        </li>

                        <li>
                            <a href="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" target="_blank">Srinagar</a>
                        </li>
                    </ol>
                </li>

                <!-- South India -->
                <li>
                    <span class="region">South India</span>

                    <ol type="i">
                        <li>
                            <a href="https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=900&q=80" target="_blank">Chennai</a>
                        </li>

                        <li>
                            <a href="https://images.unsplash.com/photo-1524492412937-b28074a5d7da?auto=format&fit=crop&w=900&q=80" target="_blank">Bangalore</a>
                        </li>

                        <li>
                            <a href="https://images.unsplash.com/photo-1505761671935-60b3a7427bad?auto=format&fit=crop&w=900&q=80" target="_blank">Kochi</a>
                        </li>
                    </ol>
                </li>

            </ul>
        </li>
    </ul>

</body>
</html>
