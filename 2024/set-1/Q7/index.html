<!DOCTYPE html>
<html>
<head>
    <title>CSS Properties Demo</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            color: darkblue;
            text-align: center;
            font-size: 32px;
        }

        .heading {
            color: green;
            font-size: 24px;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Web Page</h1>

    <h2 class="heading">About CSS</h2>

    <p class="para">
        CSS stands for Cascading Style Sheets. It is used to
        style and design HTML web pages.
    </p>

    <p class="para">
        CSS can be used to change colors, font sizes, spacing,
        margins, padding and many other properties.
    </p>

    <h2 class="heading">Useful Links</h2>

    <a href="https://www.google.com">Google</a>
    <br><br>
    <a href="https://www.wikipedia.org">Wikipedia</a>

</body>
</html>
