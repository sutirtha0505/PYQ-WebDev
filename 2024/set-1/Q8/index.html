<!DOCTYPE html>
<html>
<head>
    <title>Responsive Two Column Layout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        /* Two-column layout */
        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .column {
            flex: 1;
            padding: 30px;
            background-color: white;
            border: 1px solid black;
        }

        h1 {
            text-align: center;
            background-color: darkblue;
            color: white;
            padding: 20px;
            margin: 0;
        }

        /* Mobile layout */
        @media (max-width: 468px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <h1>My Web Page</h1>

    <div class="container">

        <div class="column">
            <h2>Column 1</h2>
            <p>
                This is the first column of the webpage.
                It contains some sample content.
            </p>
        </div>

        <div class="column">
            <h2>Column 2</h2>
            <p>
                This is the second column of the webpage.
                It contains some sample content.
            </p>
        </div>

    </div>

</body>
</html>
